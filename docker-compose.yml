version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: hrms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Nesan@123"
      MYSQL_DATABASE: hrms_db
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network

  backend:
    build: ./hireconnect-backend
    container_name: hrms-backend
    restart: always
    depends_on:
      - mysql
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://hrms-mysql:3306/hrms_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Nesan@123"
      SERVER_ADDRESS: "0.0.0.0"
      # SPRING_PROFILES_ACTIVE: prod
    networks:
      - backend-network

  frontend:
    build:
      context: ./hireconnect-frontend
      args:
        VITE_API_BASE_URL: https://api.truecorehr.com
    container_name: hrms-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - frontend-network

  nginx:
    image: nginx:latest
    container_name: hrms-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - ./certbot/www:/var/www/certbot
    networks:
      - frontend-network
      - backend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  mysql_data:
