# File Upload Configuration
# Maximum file size for single file
spring.servlet.multipart.max-file-size=5MB
# Maximum request size (for multiple files)
spring.servlet.multipart.max-request-size=10MB
# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Upload directory path (relative to application root)
file.upload-dir=uploads/profile-photos

# Application base URL (override via env in production)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
# ===============================
# Database Configuration - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hrms
spring.datasource.username=root
spring.datasource.password=Dharani@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Show SQL with parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

file.upload-dir=./uploads
file.company-logo-upload-dir=uploads/company-logos

# ===============================
# JWT
# ===============================
jwt.secret=your-secret-key-change-this-in-production-minimum-256-bits
jwt.expiration=86400000

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://app.truecorehr.com, http://app.truecorehr.com

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.hrms=DEBUG
logging.level.org.springframework.web=DEBUG

# ===============================

# Email Configuration
spring.mail.host=mail.truerize.com
spring.mail.port=465
spring.mail.username=truecorehr@truerize.com
spring.mail.password=Truecorehr@123456
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Admin Email
app.admin.email=admin@yourcompany.com
app.company.name=Truerize HRMS
# ===============================
# WebSocket
# ===============================
websocket.allowed-origins=http://localhost:3000,http://localhost:5173,http://app.truecorehr.com, https://app.truecorehr.com

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2