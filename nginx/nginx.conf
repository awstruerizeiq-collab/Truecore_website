worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Upstreams
    upstream frontend_upstream {
        server hrms-frontend:80;
    }

    upstream backend_upstream {
        server hrms-backend:8080;
    }

    # 1) HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name truecorehr.com www.truecorehr.com app.truecorehr.com api.truecorehr.com;
        return 301 https://$host$request_uri;
    }

    # 2) Root domain -> app subdomain
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name truecorehr.com www.truecorehr.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        return 301 https://app.truecorehr.com$request_uri;
    }

    # 3) Frontend: app.truecorehr.com
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name app.truecorehr.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 4) Backend: api.truecorehr.com
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.truecorehr.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
