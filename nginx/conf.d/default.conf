# ---------------------------------------------------------
# GLOBAL (Docker DNS resolver)
# ---------------------------------------------------------
resolver 127.0.0.11 ipv6=off valid=10s;

# ---------------------------------------------------------
# 1) HTTP -> HTTPS (all domains)
# ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name truecorehr.com www.truecorehr.com app.truecorehr.com api.truecorehr.com;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------
# 2) ROOT + WWW -> redirect to APP (HTTPS)
# Uses app cert files to avoid "file not found" issues.
# ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name truecorehr.com www.truecorehr.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    return 301 https://app.truecorehr.com$request_uri;
}

# ---------------------------------------------------------
# 3) FRONTEND: app.truecorehr.com (HTTPS)
# ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.truecorehr.com;

    ssl_certificate     /etc/nginx/ssl/app-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/app-privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (safe)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------
# 4) BACKEND: api.truecorehr.com (HTTPS)
# ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.truecorehr.com;

    ssl_certificate     /etc/nginx/ssl/api-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api-privkey.pem;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
